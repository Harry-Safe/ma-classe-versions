# Configuration de cargo-about (notices des bibliothèques Rust de l'application Windows) :
# build/licences-rust.py lance « cargo about generate --format json » et écrit licences/licences-rust.txt.
# Licences acceptées : toutes compatibles avec la GNU GPL version 3 (licence de Ma classe). Une bibliothèque sous une
# autre licence fait échouer la génération : à examiner avant de l'ajouter ici.
accepted = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
    "Unicode-3.0", "Unicode-DFS-2016", "Unlicense", "CC0-1.0", "0BSD", "BSL-1.0", "MPL-2.0", "GPL-3.0-or-later",
]
# seulement ce qui est compilé dans l'application Windows (Cargo.lock liste aussi Linux et macOS)
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
