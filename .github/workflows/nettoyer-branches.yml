# Supprime les branches qui ne servent plus (lot D de l'audit de sécurité et de propreté, 13 novembre 2026).
# À lancer À LA MAIN par Franck (Actions › Nettoyer les branches › Run workflow) : les assistants n'ont pas le droit de
# supprimer une branche. Par défaut, rien n'est supprimé : la liste s'affiche seulement ; choisir « oui » pour supprimer.
# Supprimées : les branches déjà contenues dans main, les branches de fabrication seule (claude/fabrication-*), et les
# anciennes branches de préparation des publications listées ci-dessous (leur contenu a été publié autrement, voir
# JOURNAL_INTERVENTIONS.md). Jamais : main, ni une branche modifiée depuis moins d'un jour.
name: Nettoyer les branches
on:
  workflow_dispatch:
    inputs:
      supprimer:
        description: "Supprimer vraiment ? (non = afficher la liste seulement)"
        type: choice
        options: ["non", "oui"]
        default: "non"
permissions:
  contents: write

jobs:
  nettoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Branches qui ne servent plus
        env:
          SUPPRIMER: ${{ inputs.supprimer }}
          ANCIENNES: >-
            claude/documentation claude/essai-5.1.1 claude/essai-5.1.2 claude/essai-5.1.3 claude/essai-5.1.5
            claude/essai-5.2.1 claude/fabrication-publique claude/stable-5.2.0 claude/store-applis
            codex/publication-5.1 essai-presentation
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          limite=$(date -d '1 day ago' +%s)
          n=0
          for ref in $(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin); do
            case "$ref" in HEAD|main) continue;; esac
            pourquoi=""
            git merge-base --is-ancestor "origin/$ref" origin/main && pourquoi="contenue dans main"
            case "$ref" in claude/fabrication-*) pourquoi="fabrication seule";; esac
            printf '%s\n' $ANCIENNES | grep -qx "$ref" && pourquoi="ancienne préparation de publication"
            [ -z "$pourquoi" ] && { echo "gardée : $ref"; continue; }
            if [ "$(git log -1 --format=%ct "origin/$ref")" -gt "$limite" ]; then echo "gardée (moins d'un jour) : $ref"; continue; fi
            n=$((n+1))
            if [ "$SUPPRIMER" = "oui" ]; then git push -q origin --delete "$ref" && echo "supprimée ($pourquoi) : $ref"; else echo "à supprimer ($pourquoi) : $ref"; fi
          done
          echo "$n branche(s)$( [ "$SUPPRIMER" = "oui" ] && echo ' supprimée(s)' || echo ' : relancer avec « oui » pour les supprimer')"
