# Fabrique l'application Windows de chaque canal (si elle n'est pas déjà dans le dépôt), puis signe versions.json, le
# catalogue du Store des applis (applis.json) et les installateurs, et publie le site des mises à jour de Ma classe
# (GitHub Pages).
# La fabrication se fait ici (dépôt public : minutes GitHub sans quota) à partir de la page publiée sur le canal et de
# la coquille Tauri de coquille/<canal>/ ; une même fabrication est réutilisée tant que ni l'une ni l'autre ne change.
# Branches claude/fabrication-* : fabrication seule, pour essayer une coquille ; rien n'est signé ni publié, mais toute la
# chaîne de signature est essayée avec une clé jetable (outils/signer-appli.py --a-blanc).
# Chaîne de signature (lot C de l'audit de sécurité, 13 novembre 2026) : actions désignées par leur commit (l'étiquette
# en commentaire), paquets Python à versions et empreintes fixées (outils/exigences.txt), outil de signature installé
# depuis outils/signature/package-lock.json AVANT que la clé soit dans l'environnement, sans script d'installation ;
# chaque signature revérifiée avec la clé publique de l'application avant publication.
# Mettre à jour une action : son nouveau commit (git ls-remote https://github.com/<action> refs/tags/<étiquette>).
name: Publier les mises à jour
on:
  push:
    branches: [main, "claude/fabrication-*"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  appli:
    name: Application Windows (${{ matrix.canal }})
    runs-on: windows-latest
    strategy:
      matrix:
        canal: [stable, essai]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Faut-il fabriquer ?
        id: plan
        run: python outils/fabriquer-appli.py ${{ matrix.canal }} --plan
      - name: Fabrication déjà faite ?
        if: steps.plan.outputs.fabriquer == 'oui'
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: paquet
          key: appli-${{ matrix.canal }}-${{ steps.plan.outputs.cle }}
      - name: Préparer la coquille et la page
        if: steps.plan.outputs.fabriquer == 'oui' && steps.cache.outputs.cache-hit != 'true'
        run: python outils/fabriquer-appli.py ${{ matrix.canal }} --preparer
      - if: steps.plan.outputs.fabriquer == 'oui' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - if: steps.plan.outputs.fabriquer == 'oui' && steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branche stable
        with:
          toolchain: stable
      - if: steps.plan.outputs.fabriquer == 'oui' && steps.cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "construction/tauri/src-tauri -> target"
          key: ${{ matrix.canal }}
      - name: Fabriquer l'installateur
        if: steps.plan.outputs.fabriquer == 'oui' && steps.cache.outputs.cache-hit != 'true'
        run: python outils/fabriquer-appli.py ${{ matrix.canal }} --compiler
      - name: Garder la fabrication
        if: steps.plan.outputs.fabriquer == 'oui' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: paquet
          key: appli-${{ matrix.canal }}-${{ steps.plan.outputs.cle }}
      - name: Transmettre à la publication
        if: steps.plan.outputs.fabriquer == 'oui'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appli-${{ matrix.canal }}
          path: paquet/${{ steps.plan.outputs.nom }}
          if-no-files-found: error
          retention-days: 1

  # Branches claude/fabrication-* : même rangement que la publication, sans rien signer ni publier.
  verifier:
    needs: appli
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copie des fiches comme sur le site
        run: mkdir -p _site && cp -r appli _site/appli
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: appli-*
          path: paquets
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Paquets Python fixés
        run: pip install --require-hashes --only-binary=':all:' -r outils/exigences.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Outil de signature (versions et empreintes fixées, sans scripts)
        working-directory: outils/signature
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Ranger et contrôler
        run: |
          python3 outils/fabriquer-appli.py --placer paquets
          python3 - <<'PY'
          import json, pathlib, sys
          for f in pathlib.Path("_site/appli").rglob("latest.json"):
              d = json.loads(f.read_text(encoding="utf-8"))
              exe = f.parent / d["platforms"]["windows-x86_64"]["url"].rsplit("/", 1)[-1]
              if not exe.is_file(): sys.exit(f"{exe} manquant")
              print(f"{f.parent} : {d['version']} -> {exe.name} ({exe.stat().st_size} octets)")
          PY
      - name: Chaîne de signature à blanc (clé jetable)
        run: python3 outils/signer-appli.py --a-blanc

  publier:
    needs: appli
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Paquets Python fixés
        run: pip install --require-hashes --only-binary=':all:' -r outils/exigences.txt
      - name: Signer versions.json et applis.json
        env:
          MAJ_CLE_PRIVEE: ${{ secrets.MAJ_CLE_PRIVEE }}
        run: python outils/signer.py
      - name: Installateurs fabriqués
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: appli-*
          path: paquets
      - name: Ranger les installateurs fabriqués
        run: python outils/fabriquer-appli.py --placer paquets
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('appli/latest.json') != ''
        with:
          node-version: "24"
      - name: Outil de signature (versions et empreintes fixées, sans scripts ; la clé n'est pas encore là)
        if: hashFiles('appli/latest.json') != ''
        working-directory: outils/signature
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Signer l'application Windows
        if: hashFiles('appli/latest.json') != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: python outils/signer-appli.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1