<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f4ec">
<title>Page introuvable · Glacis – Ma classe</title>
<link rel="icon" type="image/svg+xml" href="/icone.svg">
<style>
  @font-face{font-family:"Glacis Lecture";font-weight:400;font-display:swap;src:url(/vitrine/polices/glacis-lecture-400.woff2) format("woff2")}
  @font-face{font-family:"Glacis Lecture";font-weight:700;font-display:swap;src:url(/vitrine/polices/glacis-lecture-700.woff2) format("woff2")}
  :root{--encre:#1f2d55;--bleu:#2f4fa8;--doux:#56617f;--papier:#f7f4ec;--pale:#e6edfb}
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;font-family:"Glacis Lecture",-apple-system,"Segoe UI",sans-serif;color:var(--encre);
    background:linear-gradient(160deg,var(--papier),var(--pale));line-height:1.55;padding:24px;box-sizing:border-box}
  main{max-width:30rem;text-align:center}
  img{width:96px;height:96px;border-radius:23%;box-shadow:0 .7rem 1.8rem -.6rem color-mix(in srgb,var(--bleu) 28%,transparent)}
  h1{font-size:1.6rem;margin:1.1rem 0 .4rem}
  p{color:var(--doux);margin:0 0 1.6rem}
  a{display:inline-block;padding:.7rem 1.4rem;border-radius:999px;background:var(--bleu);color:#fff;text-decoration:none;font-weight:700}
  a:focus-visible{outline:3px solid #2f6fd6;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/icone.svg" alt="">
  <h1>Cette page n'existe pas</h1>
  <p>L'adresse est peut-être mal recopiée, ou la page a changé de place.</p>
  <a href="/">Revenir à Glacis</a>
</main>
</body>
</html>
